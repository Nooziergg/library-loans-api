# Brings up the whole system with one command: `docker compose up`.
# Works unchanged under Podman (`podman compose up`) — no Docker-only syntax here.
#
# Every credential below is a DEVELOPMENT value, committed on purpose so the project runs
# out of the box. Production guidance is in the README.

services:
  db:
    image: postgres:16-alpine
    container_name: library-db
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library_dev_password
    ports:
      # Deliberately NOT the default 5432. A reviewer with PostgreSQL already installed — which is
      # most developer machines — would otherwise get a port-allocation failure on the very first
      # command in the README, and nothing after that matters.
      #
      # The API reaches the database over the compose network and does not use this at all; it is
      # here only so a tool like psql or DBeaver can connect from the host. The test suite does not
      # need it either: Testcontainers starts its own PostgreSQL on a random port, which is what
      # makes "tests never touch the development database" true by construction.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-api
    depends_on:
      db:
        # Gate on the healthcheck, never on a sleep: the API must not race the database.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: "Host=db;Port=5432;Database=library;Username=library;Password=library_dev_password"
      # Migrations are applied on startup for convenience on a clean machine. The README explains
      # why a production deployment would not do this. Only flags the application actually reads
      # appear here — a flag nothing consumes is worse than no flag, because it reads as
      # configuration that works.
      MIGRATE_ON_STARTUP: "true"
      # Fills an empty database with a working library so there is something to explore
      # immediately. Idempotent, so restarting does not duplicate it.
      SEED_ON_STARTUP: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
